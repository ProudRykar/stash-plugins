name: Sync Tag Relations

on:
  repository_dispatch:
    types:
      - tag-relations-updated

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout stash-plugins
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout tag-relations
        uses: actions/checkout@v4
        with:
          repository: ProudRykar/tag-relations
          ref: main
          path: tag-relations-source
          fetch-depth: 1

      - name: Sync plugin
        run: |
          set -e

          rm -rf plugins/tag-relations
          mkdir -p plugins/tag-relations

          cp -a tag-relations-source/. \
            plugins/tag-relations/

          rm -rf plugins/tag-relations/.git

      - name: Show changes
        run: |
          git status --short

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add plugins/tag-relations

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Sync tag-relations"

          git push origin main

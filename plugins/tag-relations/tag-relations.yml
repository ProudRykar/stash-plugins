name: Tag Relations
description: Manage relationships between Stash tags (similar/related)
version: 0.1.5
url: https://github.com/ProudRykar/stash-plugins

interface: raw

exec:
  - python
  - "{pluginDir}/backend/main.py"

ui:
  javascript:
    - index.js
  css:
    - styles.css

settings:
  database_path:
    displayName: Database path
    type: STRING
    default: ""

hooks:
  - name: tag-destroy
    triggeredBy:
      - Tag.Destroy.Post
  - name: tag-merge
    triggeredBy:
      - Tag.Merge.Post

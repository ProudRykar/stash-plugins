name: Tag Relations
description: Manage relationships between Stash tags (similar/related)
version: 0.1.5
url: https://github.com/proudrykar/tag-relations

settings:
  database_path:
    displayName: Database path
    type: STRING
    default: ""

ui:
  javascript:
    - ui/index.js
  css:
    - ui/styles.css

exec:
  - python
  - "{pluginDir}/backend/main.py"

interface: raw

hooks:
  - name: tag-destroy
    triggeredBy:
      - Tag.Destroy.Post
  - name: tag-merge
    triggeredBy:
      - Tag.Merge.Post
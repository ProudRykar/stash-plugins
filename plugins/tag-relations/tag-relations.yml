name: Tag Relations
description: Manage relationships between Stash tags (similar/related)
version: 0.1.6
url: https://github.com/ProudRykar/stash-plugins

settings:
  database_path:
    displayName: Database path
    type: STRING

ui:
  javascript:
    - index.js
  css:
    - styles.css

exec:
  - python
  - "{pluginDir}/backend/main.py"

interface: raw

hooks:
  - name: tag-destroy
    triggeredBy:
      - Tag.Destroy.Post

  - name: tag-merge
    triggeredBy:
      - Tag.Merge.Post
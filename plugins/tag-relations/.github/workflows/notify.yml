name: Notify stash-plugins

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Notify stash-plugins
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.STASH_PLUGINS_TOKEN }}
          repository: ProudRykar/stash-plugins
          event-type: tag-relations-updated
          client-payload: >-
            {
              "sha": "${{ github.sha }}"
            }

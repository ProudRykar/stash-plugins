name: Notify stash-plugins

on:
  push:
    branches:
      - develop

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Notify stash-plugins
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.STASH_PLUGINS_TOKEN }}
          repository: ProudRykar/stash-plugins
          event-type: external-ass-subtitles-updated
          client-payload: >-
            {
              "sha": "${{ github.sha }}"
            }